name: Megapack Listing

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Mega pack title (e.g. Ocean and Mermaid Mega Bundle)'
        required: true
      dropbox_folder:
        description: 'Dropbox folder path with all PNGs (e.g. /etsy-automation/megapacks/ocean-mermaid)'
        required: true
      price:
        description: 'Price in EUR'
        required: true
        default: '6.99'
      image_count:
        description: 'Number of PNG files (required when using Dropbox share link)'
        required: false
        default: '0'

jobs:
  create-megapack-listing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests reportlab Pillow dropbox
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: Create megapack listing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: |
          python megapack_listing.py \
            --title "${{ github.event.inputs.title }}" \
            --dropbox-folder "${{ github.event.inputs.dropbox_folder }}" \
            --price "${{ github.event.inputs.price }}" \
            --image-count "${{ github.event.inputs.image_count }}"
