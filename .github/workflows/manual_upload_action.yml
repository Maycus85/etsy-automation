name: Manual Pack Upload

on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: 'Folder name under uploads/ - use descriptive name with all motifs (e.g. kawaii-baby-mermaids-seahorse-starfish-coral)'
        required: true
      theme:
        description: 'Full theme name (e.g. Kawaii Baby Mermaids Seahorse Reef)'
        required: true
      short_title:
        description: 'Short 4-word title (e.g. Mermaid Seahorse Reef)'
        required: true

jobs:
  manual-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests reportlab Pillow dropbox numpy rembg onnxruntime
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: Run manual upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: |
          python manual_upload.py \
            --folder "uploads/${{ github.event.inputs.folder_name }}" \
            --theme "${{ github.event.inputs.theme }}" \
            --short-title "${{ github.event.inputs.short_title }}"

      - name: Cleanup uploaded folder
        run: |
          git config user.name "etsy-bot"
          git config user.email "bot@etsy-automation"
          git rm -r "uploads/${{ github.event.inputs.folder_name }}" || true
          git commit -m "Cleanup: remove uploads/${{ github.event.inputs.folder_name }}" || true
          git push || true
