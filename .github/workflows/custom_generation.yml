name: Custom Theme Generation

on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Themes to generate (comma-separated, e.g. "Fire Truck, Police Car, Ambulance")'
        required: true
      style:
        description: 'Visual style'
        required: true
        default: 'aquarell'
        type: choice
        options:
          - aquarell
          - comic-kindlich
          - kawaii
          - silhouette
      color_palette:
        description: 'Color palette (optional)'
        required: false
        default: 'neutral'
        type: choice
        options:
          - neutral
          - pastel
          - baby-pink
          - baby-blue
          - fire-red
          - eucalyptus
          - butterlemon
          - moody-autumn
          - gold-cream
          - citrus
          - navy
          - dark-gothic
          - coffee-faded
          - teal-orange
      count:
        description: 'Images per theme'
        required: true
        default: '20'

jobs:
  custom-generation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        theme: ${{ fromJson(needs.parse-themes.outputs.themes) }}
    needs: parse-themes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests reportlab Pillow dropbox numpy rembg onnxruntime
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: Generate images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          python custom_generation.py \
            --theme "${{ matrix.theme }}" \
            --style "${{ github.event.inputs.style }}" \
            --color "${{ github.event.inputs.color_palette }}" \
            --count "${{ github.event.inputs.count }}"

      - name: Quality check
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python quality_check.py

      - name: Create Preview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python create_preview.py

      - name: Upload to Dropbox
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: python upload_to_dropbox.py

      - name: Create Thank You PDF
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: python create_thankyou_pdf.py

      - name: Upload to Etsy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: python upload_to_etsy.py

      - name: Cleanup
        run: python cleanup.py

      - name: Commit results
        run: |
          git config user.name "etsy-bot"
          git config user.email "bot@etsy-automation"
          git add themes.json themes_today.json listing_today.json
          git commit -m "Custom: ${{ matrix.theme }}" || true
          git push || true

  parse-themes:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.parse.outputs.themes }}
    steps:
      - name: Parse themes input
        id: parse
        run: |
          python3 -c "
          import json
          themes = '${{ github.event.inputs.themes }}'.split(',')
          themes = [t.strip() for t in themes if t.strip()]
          print('themes=' + json.dumps(themes))
          " >> $GITHUB_OUTPUT
