name: Template Listing Upload

on:
  workflow_dispatch:
    inputs:
      mockup_folder:
        description: 'Folder name under uploads/ with mockup image(s) (e.g. wedding-invitation-floral)'
        required: true
      theme:
        description: 'Full theme name (e.g. Wedding Invitation Editable Canva Template Floral)'
        required: true
      short_title:
        description: 'Short title (e.g. Wedding Invitation Template)'
        required: true
      canva_link:
        description: 'Shareable Canva template link'
        required: true
      price:
        description: 'Price in EUR'
        required: true
        default: '8.99'

jobs:
  upload-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests Pillow reportlab
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: Upload template listing to Etsy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          INPUT_MOCKUP_FOLDER: ${{ github.event.inputs.mockup_folder }}
          INPUT_THEME: ${{ github.event.inputs.theme }}
          INPUT_SHORT_TITLE: ${{ github.event.inputs.short_title }}
          INPUT_CANVA_LINK: ${{ github.event.inputs.canva_link }}
          INPUT_PRICE: ${{ github.event.inputs.price }}
        run: |
          python template_upload.py \
            --folder "uploads/$INPUT_MOCKUP_FOLDER" \
            --theme "$INPUT_THEME" \
            --short-title "$INPUT_SHORT_TITLE" \
            --canva-link "$INPUT_CANVA_LINK" \
            --price "$INPUT_PRICE"

      - name: Cleanup uploads folder
        run: |
          git config user.name "etsy-bot"
          git config user.email "bot@etsy-automation"
          git rm -r "uploads/${{ github.event.inputs.mockup_folder }}" || true
          git commit -m "Cleanup: remove uploads/${{ github.event.inputs.mockup_folder }}" || true
          git push || true
