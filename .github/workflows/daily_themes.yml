name: Daily Clipart Pipeline

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-themes-and-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests reportlab Pillow

      - name: Generate themes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_themes.py

      - name: Generate images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python generate_images.py

      - name: Create PDF
        run: python create_pdf.py

      - name: Commit and push results
        run: |
          git config user.name "etsy-bot"
          git config user.email "bot@etsy-automation"
          git add themes.json themes_today.json images/
          git commit -m "Daily pipeline: $(date +'%Y-%m-%d')"
          git push
