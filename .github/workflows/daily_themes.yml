name: Daily Theme Generation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-themes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run theme generation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_themes.py

      - name: Commit and push updated themes
        run: |
          git config user.name "etsy-bot"
          git config user.email "bot@etsy-automation"
          git add themes.json themes_today.json
          git commit -m "Daily themes: $(date +'%Y-%m-%d')"
          git push
