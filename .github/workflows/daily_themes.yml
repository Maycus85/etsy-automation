name: Daily Clipart Pipeline

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-themes-and-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests reportlab Pillow dropbox numpy
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: Generate themes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_themes.py

      - name: Generate images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python generate_images.py

      - name: Quality check
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python quality_check.py

      - name: Create Preview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python create_preview.py

      - name: Upload PNGs to Dropbox
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: python upload_to_dropbox.py

      - name: Create Thank You PDF
        run: python create_thankyou_pdf.py

      - name: Upload to Etsy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: python upload_to_etsy.py

      - name: Cleanup images
        run: python cleanup.py

      - name: Commit and push results
        run: |
          git config user.name "etsy-bot"
          git config user.email "bot@etsy-automation"
          git add themes.json themes_today.json images/ listing_today.json
          git commit -m "Daily pipeline: $(date +'%Y-%m-%d')"
          git push
